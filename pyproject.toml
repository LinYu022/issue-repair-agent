[project]
name = "issue-repair-agent"
version = "0.1.0"
description = "Evidence-driven Python issue repair agent, implemented module by module."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.162.0",
    "psycopg[binary]==3.3.6",
    "pydantic==2.14.1",
    "uvicorn==0.54.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "httpx2==2.16.0",
    "mypy==1.18.2",
    "ruff==0.14.2",
]

[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = [".local", ".venv", "workspaces", "artifacts"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.12"
files = ["domain", "adapters", "app", "runtime", "tools", "evals"]
check_untyped_defs = true
warn_unused_ignores = true
cache_dir = ".local/mypy-cache"
