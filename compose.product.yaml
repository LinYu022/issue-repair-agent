services:
  workbench:
    image: issue-agent-workbench:p2-18
    ports:
      - "127.0.0.1:8018:8018"
    volumes:
      - ./.local/p2-18/workbench.json:/data/workbench.json:ro
      - ./.local/p2-18/credentials.json:/data/credentials.json:ro
    read_only: true
    tmpfs:
      - /tmp
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
