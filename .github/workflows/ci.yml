name: CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen --no-dev --python "$(which python)"
      - run: uv run --frozen --no-dev python -m compileall -q adapters app domain evals runtime scripts tools
      - run: uv run --frozen --no-dev python -m scripts.run_agent --help
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.25.0'
      - run: pnpm --dir app/web install --frozen-lockfile
      - run: node app/web/build.mjs
